# Render Blueprint — Ma-yi Sentinel (Docker)
# https://render.com/docs/blueprint-spec
#
# Deploy: connect this repo in Render → "New Blueprint Instance"
# Or: push and use the Dockerfile with a Web Service.

services:
  - type: web
    name: mayi-sentinel
    runtime: docker
    plan: starter          # upgrade to standard/pro for more RAM (ML + yfinance)
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8000"
      - key: DATA_SOURCE
        value: yfinance
      - key: AUTO_SCAN_ENABLED
        value: "true"
      - key: AUTO_SCAN_INTERVAL_SEC
        value: "3600"
      - key: AUTO_SCAN_MODE
        value: replay
      - key: AUTO_SCAN_TIMEFRAME
        value: 1h
      - key: AUTO_SCAN_PERIOD
        value: 5d
      - key: AUTO_SCAN_ON_START
        value: "true"
      - key: EXECUTE_ENABLED
        value: "false"
      - key: EXEC_KILL_SWITCH
        value: "false"
      - key: PYTHONUNBUFFERED
        value: "1"
      # Optional — set in Render dashboard (secret)
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: OANDA_API_KEY
        sync: false
      - key: OANDA_ACCOUNT_ID
        sync: false
      - key: OANDA_ENV
        value: practice
    disk:
      name: mayi-data
      mountPath: /app/data/store
      sizeGB: 2
